services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: eve_healthcare
      POSTGRES_USER: eve
      POSTGRES_PASSWORD: eve_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
  api:
    build: .
    depends_on:
      - db
    environment:
      DATABASE_URL: postgresql+psycopg2://eve:eve_password@db:5432/eve_healthcare
      JWT_SECRET: change-this-secret
    ports:
      - "8000:8000"
volumes:
  postgres_data:
